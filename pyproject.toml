[project]
name = "murmure"
version = "0.1.0"
description = "Lecteur EPUB desktop avec synthèse vocale neuronale locale."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6>=6.11,<7",
    "EbookLib>=0.18,<1",
    "beautifulsoup4>=4.12,<5",
    "kokoro-onnx>=0.6,<1",
    "soundfile>=0.13,<1",
    "misaki-fork[en]>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]

[project.scripts]
murmure = "murmure.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/murmure"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
